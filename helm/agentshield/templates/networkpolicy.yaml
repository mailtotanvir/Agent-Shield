{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentshield.fullname" . }}-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentshield.name" . }}
      app.kubernetes.io/component: broker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.allowedNamespaceLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.broker.port }}
{{- end }}
