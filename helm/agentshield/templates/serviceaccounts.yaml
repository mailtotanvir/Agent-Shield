apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentshield.fullname" . }}-operator
  labels:
    app.kubernetes.io/name: {{ include "agentshield.name" . }}
    app.kubernetes.io/component: operator
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentshield.fullname" . }}-broker
  labels:
    app.kubernetes.io/name: {{ include "agentshield.name" . }}
    app.kubernetes.io/component: broker
  {{- if .Values.gcp.serviceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gcp.serviceAccount | quote }}
  {{- end }}
automountServiceAccountToken: true

