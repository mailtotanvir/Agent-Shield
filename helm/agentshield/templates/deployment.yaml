{{- $tlsSecret := required "tls.secretName is required" .Values.tls.secretName -}}
{{- $kmsKey := required "gcp.kmsKeyRef is required" .Values.gcp.kmsKeyRef -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentshield.fullname" . }}-broker
  labels:
    app.kubernetes.io/name: {{ include "agentshield.name" . }}
    app.kubernetes.io/component: broker
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentshield.name" . }}
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentshield.name" . }}
        app.kubernetes.io/component: broker
    spec:
      serviceAccountName: {{ include "agentshield.fullname" . }}-broker
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: {{ include "agentshield.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AGENTSHIELD_ENVIRONMENT
              value: {{ .Values.runtime.environment | quote }}
            - name: AGENTSHIELD_KMS_PROVIDER
              value: {{ .Values.runtime.kmsProvider | quote }}
            - name: AGENTSHIELD_KMS_KEY_REF
              value: {{ $kmsKey | quote }}
            {{- if eq .Values.runtime.kmsProvider "fake" }}
            - name: AGENTSHIELD_FAKE_KMS_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtime.fakeKmsSecretName is required for fake KMS" .Values.runtime.fakeKmsSecretName }}
                  key: key
            {{- end }}
            - name: AGENTSHIELD_TLS_CERT_FILE
              value: /var/run/agentshield-tls/tls.crt
            - name: AGENTSHIELD_TLS_KEY_FILE
              value: /var/run/agentshield-tls/tls.key
          ports:
            - name: https
              containerPort: {{ .Values.broker.port }}
          readinessProbe:
            tcpSocket:
              port: https
          livenessProbe:
            tcpSocket:
              port: https
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{- toYaml .Values.broker.resources | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /var/run/agentshield-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentshield.fullname" . }}-operator
  labels:
    app.kubernetes.io/name: {{ include "agentshield.name" . }}
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentshield.name" . }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentshield.name" . }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "agentshield.fullname" . }}-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "agentshield.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["kopf", "run", "-m", "agentshield.secrets.operator", "--all-namespaces"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
