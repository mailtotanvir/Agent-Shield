apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentsecrets.agentshield.io
spec:
  group: agentshield.io
  scope: Namespaced
  names:
    plural: agentsecrets
    singular: agentsecret
    kind: AgentSecret
    shortNames: [asecret]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [secretType, encryption, access]
              properties:
                secretType:
                  type: string
                  enum: [APIKey, OAuthRefreshToken, Generic]
                encryption:
                  type: object
                  required: [provider, keyRef]
                  properties:
                    provider:
                      type: string
                      enum: [gcp-kms]
                    keyRef:
                      type: string
                      pattern: '^projects/[^/]+/locations/[^/]+/keyRings/[^/]+/cryptoKeys/[^/]+$'
                rotation:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    intervalHours:
                      type: integer
                      minimum: 1
                      maximum: 8760
                      default: 24
                    notifyOnRotation:
                      type: boolean
                      default: true
                access:
                  type: object
                  required: [allowedServiceAccounts]
                  properties:
                    allowedServiceAccounts:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            minLength: 1
                          namespace:
                            type: string
                            minLength: 1
                    scopedTo:
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
