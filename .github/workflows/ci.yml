name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy agentshield
      - run: uv run pytest --cov=agentshield --cov-report=xml
      - run: uv run bandit -q -r agentshield
      - run: uv run semgrep scan --jobs 1 --config .semgrep.yml --error
        env:
          SEMGREP_SEND_METRICS: "off"
      - run: uv run pip-audit
      - name: Render Helm chart for policy scan
        run: >-
          helm template test helm/agentshield
          --namespace agentshield-system
          --set image.repository=agentshield
          --set image.tag=scan
          --set tls.secretName=broker-tls
          --set gcp.kmsKeyRef=projects/test/locations/global/keyRings/test/cryptoKeys/test
          --set runtime.environment=test
          --set runtime.kmsProvider=fake
          --set runtime.fakeKmsSecretName=fake-kms
          > /tmp/agentshield-rendered.yaml
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          # Dependencies are audited from uv.lock; scanning the hydrated .venv
          # duplicates that result and also includes build-tool packages.
          skip-dirs: helm/agentshield,.venv,.cache
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: config
          scan-ref: /tmp/agentshield-rendered.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
