apiVersion: agentshield.io/v1alpha1
kind: AgentSecret
metadata:
  name: llm-key
  namespace: agents
spec:
  secretType: APIKey
  encryption:
    provider: gcp-kms
    keyRef: projects/REPLACE/locations/REPLACE/keyRings/REPLACE/cryptoKeys/REPLACE
  rotation:
    enabled: true
    intervalHours: 24
    notifyOnRotation: true
  access:
    allowedServiceAccounts:
      - name: agent-runner
        namespace: agents
    scopedTo:
      matchLabels:
        app: authorized-agent
